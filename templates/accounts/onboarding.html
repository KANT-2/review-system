{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AX 평가 시스템 필수 프로필 등록">
    <title>필수 프로필 등록 - AX Evaluation Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
  </head>
  <body class="auth-page d-flex align-items-center justify-content-center">
    <div class="auth-card card card-custom p-4 shadow-sm">
      <div class="text-center mb-3">
        <div class="icon-box-44 d-inline-flex align-items-center justify-content-center rounded-circle bg-primary text-white mb-2">
          <i class="bi bi-stars fs-4"></i>
        </div>
        <h5 class="fw-bold mb-1">환영합니다! 필수 프로필 온보딩</h5>
        <p class="text-muted small">평가 참여를 위해 필수 프로필 정보를 등록해 주세요.</p>
      </div>
      {% include "includes/messages.html" %}
      <form method="post" action="{% url 'accounts:onboarding' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-bold">이름 *</label>
          {{ form.name }}
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">소속 기수 / 세션 *</label>
          {{ form.session_info }}
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold">연락처 *</label>
          {{ form.phone }}
        </div>
        <button type="submit" class="btn btn-ax-primary w-100 py-2">온보딩 완료 및 대시보드 시작</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
