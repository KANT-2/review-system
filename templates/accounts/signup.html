{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - AX Evaluation Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--ax-bg);">

  <div class="card card-custom p-4 shadow-sm" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-3">
      <h4 class="fw-bold mb-1">회원가입 신청</h4>
      <p class="text-muted small">사전 등록된 이메일은 즉시 자동 승인됩니다.</p>
    </div>

    {% include "includes/messages.html" %}

    <form method="POST" action="{% url 'accounts:signup' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-bold">이름 *</label>
        {{ form.name }}
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">이메일 (ID) *</label>
        {{ form.email }}
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">비밀번호 *</label>
        {{ form.password }}
      </div>

      <button type="submit" class="btn btn-ax-primary w-100 py-2 mb-2">가입 신청</button>
      <a href="{% url 'accounts:login' %}" class="btn btn-ax-secondary w-100 py-2">로그인 화면으로</a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
