{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - AX Evaluation Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--ax-bg);">

  <div class="card card-custom p-4 shadow-sm" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary text-white mb-2" style="width: 48px; height: 48px;">
        <i class="bi bi-mortarboard-fill fs-4"></i>
      </div>
      <h4 class="fw-bold mb-1">AX Evaluation Console</h4>
      <p class="text-muted small">주차별 역량 기반 튜터링 & 동료 평가 시스템</p>
    </div>

    {% include "includes/messages.html" %}

    <form method="POST" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-bold">아이디 (이메일)</label>
        {{ form.email }}
      </div>
      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <label class="form-label small fw-bold">비밀번호</label>
          <a href="#" class="small text-decoration-none" onclick="alert('비밀번호 재설정 링크가 이메일로 발송됩니다.')">비밀번호 찾기</a>
        </div>
        {{ form.password }}
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3 small">
        <div class="form-check">
          {{ form.save_id }}
          <label class="form-check-label" for="{{ form.save_id.id_for_label }}">아이디 저장</label>
        </div>
        <div class="form-check">
          {{ form.auto_login }}
          <label class="form-check-label" for="{{ form.auto_login.id_for_label }}">자동 로그인</label>
        </div>
      </div>

      <button type="submit" class="btn btn-ax-primary w-100 py-2 mb-2">로그인</button>
      <button type="button" class="btn btn-ax-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 mb-3" onclick="alert('구글 OAuth 연동 처리')">
        <i class="bi bi-google text-danger"></i> Google 계정으로 로그인
      </button>
    </form>

    <div class="text-center border-top pt-3 small">
      계정이 없으신가요? <a href="{% url 'accounts:signup' %}" class="fw-bold text-primary text-decoration-none">회원가입 신청</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
