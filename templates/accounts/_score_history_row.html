{% load results_extras %}
<tr>
  <td class="fw-semibold">{{ result.round_name }}</td>
  <td class="text-center">{{ result.team_score|as_five_point|default:"-" }}</td>
  <td class="text-center">{{ result.peer_score|as_five_point|default:"-" }}</td>
  <td class="text-center fw-bold">{{ result.final_score|as_five_point|default:"-" }}</td>
  <td class="text-center">{{ result.primary_rank|default:"비공개" }}</td>
  <td class="text-end">
    <a href="{% url 'accounts:mypage_round_result_csv' result.round_id %}"
       class="btn btn-sm btn-ax-secondary"><i class="bi bi-download me-1"></i>CSV</a>
  </td>
</tr>
