{% load results_extras %}
{% with score=value|as_five_point %}
  {% if score is not None %}
    <div class="ax-score-cell">
      <span class="ax-score-value">{{ score }}<span class="ax-score-suffix">/5</span></span>
      <span class="ax-score-bar">
        <span class="ax-score-bar-fill" style="width: {{ value|floatformat:0 }}%"></span>
        <span class="ax-score-bar-tick" style="left: 80%"></span>
        <span class="ax-score-bar-tick" style="left: 90%"></span>
      </span>
    </div>
  {% else %}
    <span class="ax-na-value">{{ empty_message|default:"평가 없음" }}</span>
  {% endif %}
{% endwith %}
