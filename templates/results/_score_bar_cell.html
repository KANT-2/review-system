{% load results_extras %}
{% comment %}점수 + 5점 만점 대비 막대. 눈금은 4.0점(80%)과 4.5점(90%) 위치.{% endcomment %}
{% with score=value|as_five_point %}
  {% if score is not None %}
    <div class="ax-score-cell">
      <span class="ax-score-value">{{ score }}<span class="ax-score-suffix">/5</span></span>
      <span class="ax-score-bar">
        <span class="ax-score-bar-fill"
              style="width: {{ value|five_point_percent }}%"></span>
        <span class="ax-score-bar-tick ax-score-bar-tick--four"></span>
        <span class="ax-score-bar-tick ax-score-bar-tick--four-half"></span>
      </span>
    </div>
  {% else %}
    <span class="ax-na-value">{{ empty_message|default:"평가 없음" }}</span>
  {% endif %}
{% endwith %}
