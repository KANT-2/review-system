{% load results_extras %}
{% with is_on=publish_state|get_item:item_key %}
  <div class="ax-publish-item">
    <div class="ax-publish-item-text">
      <strong>{{ label }}</strong>
      <span>{{ hint }}</span>
    </div>
    <form method="post" action="{% url 'results:toggle_publish' item_key %}">
      {% csrf_token %}
      <label class="ax-switch">
        <input type="checkbox"
               onchange="this.form.submit()"
               {% if is_on %}checked{% endif %}>
        <span class="ax-slider"></span>
      </label>
    </form>
  </div>
  {% if pending_confirm == item_key %}
    <div class="ax-confirm-banner mt-2">
      <p class="small mb-2">
        <i class="bi bi-exclamation-triangle-fill ax-trend-down"></i>
        일부만 제출된 팀·학생이 있습니다. 그래도 공개할까요?
      </p>
      <div class="d-flex gap-2">
        <form method="post" action="{% url 'results:toggle_publish' item_key %}">
          {% csrf_token %}
          <input type="hidden" name="confirm" value="1">
          <button type="submit" class="btn btn-sm btn-warning">예, 공개합니다</button>
        </form>
        <form method="post" action="{% url 'results:cancel_publish_confirm' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-secondary">취소</button>
        </form>
      </div>
    </div>
  {% endif %}
{% endwith %}
