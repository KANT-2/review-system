{% comment %}순위 배지. 1~3위는 금·은·동, 그 외는 기본 배지, 순위 없음(N/A)은 "-".{% endcomment %}
{% if rank == 1 %}
  <span class="ax-rank-badge ax-rank-badge--gold"><i class="bi bi-trophy-fill"></i>1위</span>
{% elif rank == 2 %}
  <span class="ax-rank-badge ax-rank-badge--silver"><i class="bi bi-award-fill"></i>2위</span>
{% elif rank == 3 %}
  <span class="ax-rank-badge ax-rank-badge--bronze"><i class="bi bi-award-fill"></i>3위</span>
{% elif rank %}
  <span class="ax-rank-badge">{{ rank }}위</span>
{% else %}
  <span class="ax-na-value">-</span>
{% endif %}
