{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="AX Evaluation Console results screen prototype">
    <title>{% block title %}AX Evaluation Console{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
  </head>
  <body>
    <div class="ax-shell">
      <aside class="ax-sidebar">
        <div class="ax-sidebar-brand">
          <span>AX Console</span>
        </div>
        <nav class="nav flex-column">
          <a class="nav-link" href="{% url 'home' %}">홈</a>
          <a class="nav-link {% block nav_manage %}{% endblock %}"
             href="{% url 'results:manage_preview' %}">결과·공개 (관리자)</a>
          <a class="nav-link {% block nav_me %}{% endblock %}"
             href="{% url 'results:me_preview' %}">내 결과</a>
        </nav>
      </aside>
      <div class="ax-content-area">
        <div class="ax-topbar">
          <span class="ax-breadcrumb">{% block breadcrumb %}Results{% endblock %}</span>
          <span class="text-muted small">프로토타입 · 가짜 데이터로 계산한 화면</span>
        </div>
        <main class="ax-main">
          <div class="ax-main-inner">
            {% block content %}{% endblock %}
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
