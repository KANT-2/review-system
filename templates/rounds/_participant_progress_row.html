<tr>
  <td>
    {{ row.participant.display_name_snapshot }}
    <div class="small text-muted">{{ row.participant.student_number_snapshot }}</div>
  </td>
  <td>{{ row.team_completed }}/{{ row.team_expected }}</td>
  <td>{{ row.peer_completed }}/{{ row.peer_expected }}</td>
  <td>
    {% if row.is_unassigned %}
      <span class="badge bg-secondary">미배정</span>
    {% elif row.is_complete %}
      <span class="badge bg-success">완료</span>
    {% else %}
      <span class="badge bg-warning text-dark">미완료</span>
    {% endif %}
  </td>
</tr>
