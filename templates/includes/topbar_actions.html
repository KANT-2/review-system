<div class="topbar-actions d-flex align-items-center gap-3">
  <button type="button"
          class="btn btn-sm btn-ax-secondary ax-theme-toggle"
          id="axThemeToggle"
          title="야간모드 전환"
          aria-label="야간모드 전환">
    <i class="bi bi-moon-stars" id="axThemeIcon"></i>
  </button>
  {% if user.is_authenticated and user.role == 'student' %}
    <a href="{% url 'accounts:mypage' %}"
       class="btn btn-sm btn-ax-secondary"
       title="내 평가 결과"><i class="bi bi-bar-chart-line"></i></a>
  {% endif %}
  {% if user.is_authenticated %}
    <div class="dropdown">
      <button type="button"
              id="{% if user.role == 'tutor' or user.role == 'admin' %}tutor-profile-menu-button{% else %}user-profile-menu-button{% endif %}"
              class="btn btn-sm d-flex align-items-center gap-2 p-1 pe-2 rounded-pill border"
              data-bs-toggle="dropdown"
              aria-expanded="false"
              aria-label="사용자 프로필 메뉴 열기">
        <div class="member-avatar avatar-xs">{{ display_name|slice:":1" }}</div>
        <span class="fw-semibold small">{{ display_name }} ({{ user.session_info|default:"기수미지정" }})</span>
        <i class="font-size-11 bi bi-chevron-down text-muted" aria-hidden="true"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm"
          aria-labelledby="{% if user.role == 'tutor' or user.role == 'admin' %}tutor-profile-menu-button{% else %}user-profile-menu-button{% endif %}">
        <li>
          <h6 class="dropdown-header mb-0">{{ user.get_role_display }} 계정</h6>
          <span class="dropdown-item-text small text-muted pt-0">{{ user.email }}</span>
        </li>
        <li><a class="dropdown-item small" href="{% url 'accounts:mypage' %}"><i class="bi bi-person-lines-fill me-2" aria-hidden="true"></i>마이페이지</a></li>
        <li>
          <hr class="dropdown-divider">
        </li>
        <li>
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="dropdown-item small text-danger"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>로그아웃</button>
          </form>
        </li>
      </ul>
    </div>
  {% elif preview_mode %}
    <span class="badge text-bg-light border text-secondary">화면 미리보기</span>
  {% endif %}
</div>
