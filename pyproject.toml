[tool.ruff]
line-length = 100
indent-width = 4
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "DJ",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.djlint]
profile = "django"
indent = 2
use_gitignore = true

# 이메일 클라이언트 호환성에는 인라인 스타일이 필요하고 웹 페이지용 SEO 규칙은 적용되지 않는다.
[tool.djlint.per-file-ignores]
"templates/emails/custom_announcement.html" = "H021,H023,H030"
"templates/emails/results_released.html" = "H021,H023,H030"
"templates/emails/round_started.html" = "H021,H023,H030"
"templates/emails/submission_reminder.html" = "H021,H023,H030"
"templates/emails/verification_code.html" = "H021,H023,H030"
# ideas 앱은 Figma Make 원본 디자인을 최대한 그대로 포팅하면서 인라인 스타일을 많이 썼다.
# 클래스로 옮기는 리팩터는 별도 작업으로 남기고, 우선 CI 통과를 위해 임시로 예외 처리한다.
"ideas/templates/ideas/home.html" = "H021"
"ideas/templates/ideas/prd_new.html" = "H021"
"ideas/templates/ideas/prd_write.html" = "H021"
"ideas/templates/ideas/brainstorm.html" = "H021"
