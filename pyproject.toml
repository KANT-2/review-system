[tool.ruff]
line-length = 100
indent-width = 4
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "DJ",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.djlint]
profile = "django"
indent = 2
use_gitignore = true
