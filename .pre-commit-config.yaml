repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and import check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: djlint-format
        name: djLint format Django templates
        entry: djlint --profile=django --reformat
        language: system
        files: '\.html$'

      - id: djlint-lint
        name: djLint lint Django templates
        entry: djlint --profile=django
        language: system
        files: '\.html$'
