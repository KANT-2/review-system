{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PRD 브레인스토밍 보드" />
    <title>브레인스토밍 — {{ project.title }} — 아이디어 디벨로퍼</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui'] } } } };
    </script>
    <script crossorigin
            src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
    * { font-family: 'Pretendard', ui-sans-serif, system-ui, sans-serif; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #F8F8F7; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }

    textarea { resize: none; font-family: inherit; }
    .postit-shadow { box-shadow: 2px 3px 12px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08); }
    .conn-delete-btn { opacity: 0; transition: opacity .15s; }
    .conn-delete-btn:hover { opacity: 1 !important; }
    .postit-animated { transition: left .4s cubic-bezier(.4,0,.2,1), top .4s cubic-bezier(.4,0,.2,1); }
    .held-card { background: #fff; border: 1.5px solid #FDE68A; border-radius: 12px; padding: 8px 10px; min-width: 150px; max-width: 170px; flex-shrink: 0; cursor: pointer; transition: box-shadow .15s; position: relative; }
    .held-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .held-card:hover .held-restore { opacity: 1; }
    .held-restore { opacity: 0; transition: opacity .15s; position: absolute; top: 4px; right: 6px; font-size: 10px; color: #4F46E5; font-weight: 700; }
    </style>
  </head>
  <body>
    {% csrf_token %}
    <div id="brainstorm-root"
         data-project-id="{{ project.pk }}"
         style="height:100vh"></div>
    <script>
window.__IDEAS_DATA__ = {
  members: {{ members_json|safe }},
  initialPostits: {{ initial_postits_json|safe }},
  initialConnections: {{ initial_connections_json|safe }},
  columns: {{ columns_json|safe }},
  currentUserId: "{{ request.user.pk }}",
  syncUrl: "{% url 'ideas:brainstorm_sync' project.pk %}",
  backUrl: "{% url 'ideas:prd_write' project.pk %}",
  projectTitle: "{{ project.title|escapejs }}",
};
    </script>
    {% verbatim %}
      <script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

// ─── Constants ────────────────────────────────────────────────────────────────

const CANVAS_W = 3200;
const CANVAS_H = 1800;
const PW = 180;
const PH = 125;
const MIN_ZOOM = 0.3;
const MAX_ZOOM = 2.0;
const ZOOM_STEP = 1.15;

const COL_START_Y = 360;
const COL_W = 290;
const COL_GAP = 20;
const COL_PAD_X = 40;
const COL_HEADER_H = 72;
const COL_CONTENT_H = 1100;
const COL_TOTAL_H = COL_HEADER_H + COL_CONTENT_H;
const FREE_AREA_H = 300;
const FREE_AREA_Y = 30;

const COL_COLORS = [
  { bg: '#EEF2FF', border: '#C7D2FE', header: '#4F46E5', headerText: '#EEF2FF' },
  { bg: '#F0FDF4', border: '#BBF7D0', header: '#059669', headerText: '#F0FDF4' },
  { bg: '#FFFBEB', border: '#FDE68A', header: '#D97706', headerText: '#FFFBEB' },
  { bg: '#FDF4FF', border: '#E9D5FF', header: '#7C3AED', headerText: '#FDF4FF' },
  { bg: '#FFF1F2', border: '#FECDD3', header: '#E11D48', headerText: '#FFF1F2' },
  { bg: '#F0F9FF', border: '#BAE6FD', header: '#0284C7', headerText: '#F0F9FF' },
  { bg: '#F7FEE7', border: '#D9F99D', header: '#65A30D', headerText: '#F7FEE7' },
];

const COLORS = [
  { value: '#FEF9C3', border: '#FDE047' },
  { value: '#DBEAFE', border: '#93C5FD' },
  { value: '#FCE7F3', border: '#F9A8D4' },
  { value: '#D1FAE5', border: '#6EE7B7' },
  { value: '#FEE2E2', border: '#FCA5A5' },
  { value: '#EDE9FE', border: '#C4B5FD' },
];

const MEMBERS = window.__IDEAS_DATA__.members;
const INITIAL_POSTITS = window.__IDEAS_DATA__.initialPostits;
const INITIAL_CONNECTIONS = window.__IDEAS_DATA__.initialConnections;
const SECTIONS = window.__IDEAS_DATA__.columns;
const CURRENT_USER_ID = window.__IDEAS_DATA__.currentUserId;
const SYNC_URL = window.__IDEAS_DATA__.syncUrl;
const BACK_URL = window.__IDEAS_DATA__.backUrl;
const PROJECT_TITLE = window.__IDEAS_DATA__.projectTitle;

function getCsrfToken() {
  const input = document.querySelector('input[name="csrfmiddlewaretoken"]');
  return input ? input.value : null;
}

function syncToServer(postits, connections) {
  fetch(SYNC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
    body: JSON.stringify({ postits, connections }),
  }).catch(() => {});
}

// ─── Column definitions (PRD 섹션 = 컬럼) ───────────────────────────────────────

const COLUMNS = SECTIONS.map((s, i) => ({
  id: s.id,
  title: s.title,
  x: COL_PAD_X + i * (COL_W + COL_GAP),
  y: COL_START_Y,
  colorIdx: i % COL_COLORS.length,
}));

// ─── Geometry ─────────────────────────────────────────────────────────────────

function getCenter(p) {
  return { x: p.x + PW / 2, y: p.y + PH / 2 };
}

function getEdgePoint(p, tx, ty) {
  const cx = p.x + PW / 2, cy = p.y + PH / 2;
  const dx = tx - cx, dy = ty - cy;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return { x: cx, y: cy };
  const hw = PW / 2 - 5, hh = PH / 2 - 5;
  const sx = Math.abs(dx) > 0.01 ? hw / Math.abs(dx) : Infinity;
  const sy = Math.abs(dy) > 0.01 ? hh / Math.abs(dy) : Infinity;
  const t = Math.min(sx, sy);
  return { x: cx + dx * t, y: cy + dy * t };
}

function connPath(fromP, toP) {
  const fc = getCenter(fromP), tc = getCenter(toP);
  const fe = getEdgePoint(fromP, tc.x, tc.y);
  const te = getEdgePoint(toP, fc.x, fc.y);
  const dx = te.x - fe.x, dy = te.y - fe.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const curve = Math.min(dist * 0.1, 50);
  const cpx = (fe.x + te.x) / 2 - (dy / dist) * curve;
  const cpy = (fe.y + te.y) / 2 + (dx / dist) * curve;
  const d = `M ${fe.x} ${fe.y} Q ${cpx} ${cpy} ${te.x} ${te.y}`;
  const mx = 0.25 * fe.x + 0.5 * cpx + 0.25 * te.x;
  const my = 0.25 * fe.y + 0.5 * cpy + 0.25 * te.y;
  return { d, mx, my };
}

function findColumnForPoint(cx, cy) {
  if (cy < COL_START_Y) return null;
  for (const col of COLUMNS) {
    if (cx >= col.x && cx <= col.x + COL_W) return col.id;
  }
  return null;
}

function constrainToColumn(col, px, py) {
  const minX = col.x + 10;
  const maxX = col.x + COL_W - PW - 10;
  const minY = col.y + COL_HEADER_H + 10;
  const maxY = col.y + COL_TOTAL_H - PH - 10;
  return { x: Math.max(minX, Math.min(maxX, px)), y: Math.max(minY, Math.min(maxY, py)) };
}

// ─── PostIt Card ──────────────────────────────────────────────────────────────

function PostItCard({ postit, isSelected, isConnectSrc, isAnimated, onMouseDown, onDoubleClick, onStatusChange, onAssigneeChange, onDelete }) {
  const [menuStyle, setMenuStyle] = useState(null);
  const btnRef = useRef(null);
  const colorCfg = COLORS.find(c => c.value === postit.color) || COLORS[0];
  const author = MEMBERS.find(m => m.id === postit.authorId);
  const assignee = postit.assigneeId ? MEMBERS.find(m => m.id === postit.assigneeId) : null;

  function openMenu(e) {
    e.stopPropagation();
    if (menuStyle) { setMenuStyle(null); return; }
    if (!btnRef.current) return;
    const r = btnRef.current.getBoundingClientRect();
    const W = 178, APPROX_H = 320;
    const above = r.bottom + APPROX_H > window.innerHeight - 12;
    const left = Math.max(8, Math.min(r.right - W, window.innerWidth - W - 8));
    setMenuStyle({ position: 'fixed', left, width: W, zIndex: 99999, ...(above ? { bottom: window.innerHeight - r.top + 4 } : { top: r.bottom + 4 }) });
  }

  useEffect(() => {
    if (!menuStyle) return;
    const close = () => setMenuStyle(null);
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [menuStyle]);

  const badge = postit.status === 'accepted' ? { label: '채택됨', cls: 'bg-emerald-100 text-emerald-700', icon: '✓' } : null;
  const transStyle = isAnimated ? { transition: 'left 0.4s cubic-bezier(.4,0,.2,1), top 0.4s cubic-bezier(.4,0,.2,1)' } : {};

  return (
    <div className="absolute select-none"
      style={{ left: postit.x, top: postit.y, width: PW, height: PH, transform: `rotate(${postit.rotation}deg)`, zIndex: isSelected ? 20 : isConnectSrc ? 15 : 10, ...transStyle }}
      onMouseDown={onMouseDown} onClick={e => e.stopPropagation()} onDoubleClick={onDoubleClick}>
      <div className={['w-full h-full rounded-xl flex flex-col p-3 postit-shadow cursor-grab active:cursor-grabbing',
        isSelected ? 'ring-2 ring-indigo-400 ring-offset-1' : '', isConnectSrc ? 'ring-2 ring-violet-500 ring-offset-1' : ''].join(' ')}
        style={{ backgroundColor: postit.color, borderLeft: `3px solid ${colorCfg.border}` }}>
        <div className="flex items-center justify-between mb-1.5 gap-1">
          <div className="flex items-center gap-1 min-w-0 flex-1 overflow-hidden">
            {author && <div className="w-5 h-5 rounded-full text-white text-[8px] font-bold flex items-center justify-center shrink-0" style={{ backgroundColor: author.color }} title={author.name}>{author.initials[0]}</div>}
            {assignee && assignee.id !== postit.authorId && (
              <>
                <span className="text-[8px] text-slate-400 shrink-0">→</span>
                <div className="w-4 h-4 rounded-full text-white text-[7px] font-bold flex items-center justify-center shrink-0" style={{ backgroundColor: assignee.color }}>{assignee.initials[0]}</div>
              </>
            )}
            {badge && <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full shrink-0 ${badge.cls}`}>{badge.icon} {badge.label}</span>}
          </div>
          <button ref={btnRef} onMouseDown={e => e.stopPropagation()} onClick={openMenu} className="w-6 h-6 rounded-lg hover:bg-black/10 flex items-center justify-center text-slate-500 text-sm leading-none shrink-0 transition-colors">⋯</button>
        </div>
        <p className="flex-1 text-xs text-slate-800 leading-relaxed overflow-hidden" style={{ display: '-webkit-box', WebkitLineClamp: 4, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{postit.content}</p>
      </div>

      {menuStyle && ReactDOM.createPortal(
        <div style={menuStyle} className="bg-white rounded-xl shadow-2xl border border-slate-200 py-1.5 overflow-hidden" onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()}>
          <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 pt-1.5 pb-1">상태</p>
          {[{ s: 'default', label: '기본', icon: '○' }, { s: 'accepted', label: '채택됨', icon: '✓' }, { s: 'held', label: '보류로 이동', icon: '⏸' }].map(({ s, label, icon }) => (
            <button key={s} onClick={() => { onStatusChange(s); setMenuStyle(null); }} className={`w-full text-left px-3 py-1.5 text-xs hover:bg-indigo-50 flex items-center gap-2 transition-colors ${postit.status === s ? 'text-indigo-700 font-semibold bg-indigo-50/60' : 'text-slate-700'}`}>
              <span className="w-4 text-center text-slate-400 shrink-0">{icon}</span><span className="flex-1">{label}</span>
            </button>
          ))}
          <div className="my-1 h-px bg-slate-100 mx-2" />
          <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-3 py-1">담당자</p>
          <button onClick={() => { onAssigneeChange(null); setMenuStyle(null); }} className={`w-full text-left px-3 py-1.5 text-xs hover:bg-indigo-50 transition-colors flex items-center gap-2 ${!postit.assigneeId ? 'text-indigo-700 font-semibold' : 'text-slate-500'}`}>
            <span className="w-4 text-center text-slate-300 text-xs">—</span><span>담당자 없음</span>
          </button>
          {MEMBERS.map(m => (
            <button key={m.id} onClick={() => { onAssigneeChange(m.id); setMenuStyle(null); }} className={`w-full text-left px-3 py-1.5 text-xs hover:bg-indigo-50 flex items-center gap-2 transition-colors ${postit.assigneeId === m.id ? 'text-indigo-700 font-semibold' : 'text-slate-700'}`}>
              <div className="w-4 h-4 rounded-full text-white text-[7px] font-bold flex items-center justify-center shrink-0" style={{ backgroundColor: m.color }}>{m.initials[0]}</div>
              <span className="flex-1 truncate">{m.name}</span><span className="text-[9px] text-slate-400 shrink-0">{m.role}</span>
            </button>
          ))}
          <div className="my-1 h-px bg-slate-100 mx-2" />
          <button onClick={() => { onDelete(); setMenuStyle(null); }} className="w-full text-left px-3 py-2 text-xs text-red-500 hover:bg-red-50 transition-colors flex items-center gap-2">
            <span className="w-4 text-center shrink-0">🗑</span> 삭제
          </button>
        </div>, document.body
      )}
    </div>
  );
}

// ─── Add Modal ────────────────────────────────────────────────────────────────

function AddModal({ onAdd, onClose }) {
  const [content, setContent] = useState('');
  const [color, setColor] = useState(COLORS[0].value);
  const [authorId, setAuthorId] = useState(MEMBERS[0] ? MEMBERS[0].id : CURRENT_USER_ID);

  return (
    <div className="fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 flex flex-col gap-4">
        <div className="flex items-center justify-between">
          <h3 className="font-bold text-slate-800">메모 추가</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>
        <div className="flex gap-2 flex-wrap">
          {COLORS.map(c => (
            <button key={c.value} onClick={() => setColor(c.value)} className={`w-7 h-7 rounded-lg transition-all ${color === c.value ? 'ring-2 ring-offset-1 ring-indigo-400 scale-110' : 'hover:scale-105'}`} style={{ backgroundColor: c.value, border: `2px solid ${c.border}` }} />
          ))}
        </div>
        <textarea autoFocus value={content} onChange={e => setContent(e.target.value)} placeholder="아이디어를 자유롭게 적어보세요…" rows={4} className="border border-slate-200 rounded-xl p-3 text-sm placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-300 leading-relaxed" style={{ backgroundColor: color }} />
        <div className="flex flex-col gap-1.5">
          <label className="text-xs font-semibold text-slate-600">작성자</label>
          <select value={authorId} onChange={e => setAuthorId(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">
            {MEMBERS.map(m => <option key={m.id} value={m.id}>{m.name} ({m.role})</option>)}
          </select>
        </div>
        <div className="flex gap-3">
          <button onClick={onClose} className="flex-1 border border-slate-200 rounded-xl py-2 text-sm text-slate-600 hover:bg-slate-50 transition-colors">취소</button>
          <button onClick={() => { if (content.trim()) { onAdd(content, color, authorId); onClose(); } }} disabled={!content.trim()} className="flex-1 bg-indigo-600 text-white text-sm font-semibold rounded-xl py-2 hover:bg-indigo-700 transition-colors disabled:opacity-40">추가하기</button>
        </div>
      </div>
    </div>
  );
}

// ─── Column PRD 미리보기 모달 ────────────────────────────────────────────────────

function ColumnPRDPreview({ column, postits, onClose }) {
  const colPostits = postits.filter(p => p.columnId === column.id && p.status !== 'held');
  const accepted = colPostits.filter(p => p.status === 'accepted');
  const others = colPostits.filter(p => p.status !== 'accepted');
  const colorCfg = COL_COLORS[column.colorIdx];

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col overflow-hidden">
        <div className="flex items-center justify-between px-6 py-4 shrink-0" style={{ backgroundColor: colorCfg.header }}>
          <div>
            <p className="text-xs font-semibold opacity-70" style={{ color: colorCfg.headerText }}>AI PRD 적용 미리보기</p>
            <h3 className="text-sm font-bold mt-0.5" style={{ color: colorCfg.headerText }}>{column.title}</h3>
          </div>
          <button onClick={onClose} className="text-white/70 hover:text-white text-xl">×</button>
        </div>

        <div className="flex-1 overflow-y-auto p-6 flex flex-col gap-4">
          <div className="flex items-center gap-3 text-xs text-slate-500 pb-3 border-b border-slate-100">
            <span className="bg-emerald-50 text-emerald-700 font-semibold px-2 py-1 rounded-full">채택됨 {accepted.length}개</span>
            <span className="bg-slate-100 text-slate-600 font-semibold px-2 py-1 rounded-full">전체 {colPostits.length}개</span>
          </div>

          {colPostits.length === 0 ? (
            <div className="text-center py-8">
              <p className="text-sm text-slate-400 mb-1">이 섹션에 아이디어가 없습니다</p>
              <p className="text-xs text-slate-300">메모를 이 칸에 드래그하거나 직접 추가해보세요</p>
            </div>
          ) : (
            <>
              {accepted.length > 0 && (
                <div>
                  <p className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">채택된 아이디어 → PRD 반영</p>
                  <div className="flex flex-col gap-2">
                    {accepted.map(p => {
                      const auth = MEMBERS.find(m => m.id === p.authorId);
                      return (
                        <div key={p.id} className="flex gap-3 p-3 rounded-xl bg-emerald-50 border border-emerald-100">
                          <div className="w-1.5 shrink-0 rounded-full bg-emerald-400 self-stretch" />
                          <div className="flex-1 min-w-0">
                            <p className="text-xs text-slate-700 leading-relaxed">{p.content}</p>
                            {auth && <p className="text-[10px] text-slate-400 mt-1">{auth.name}</p>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              {others.length > 0 && (
                <div>
                  <p className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">검토 대기 아이디어</p>
                  <div className="flex flex-col gap-2">
                    {others.map(p => {
                      const auth = MEMBERS.find(m => m.id === p.authorId);
                      return (
                        <div key={p.id} className="flex gap-3 p-3 rounded-xl bg-slate-50 border border-slate-100">
                          <div className="w-1.5 shrink-0 rounded-full bg-slate-300 self-stretch" />
                          <div className="flex-1 min-w-0">
                            <p className="text-xs text-slate-600 leading-relaxed">{p.content}</p>
                            {auth && <p className="text-[10px] text-slate-400 mt-1">{auth.name}</p>}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </>
          )}
        </div>

        <div className="px-6 py-4 border-t border-slate-200 shrink-0 flex items-center justify-between gap-3">
          <button onClick={onClose} className="text-sm text-slate-500 hover:text-slate-700 px-4 py-2 rounded-lg border border-slate-200 hover:bg-white transition-colors">닫기</button>
          <button className="text-sm font-semibold px-5 py-2 rounded-lg text-white transition-colors" style={{ backgroundColor: colorCfg.header }}>PRD에 반영하기 →</button>
        </div>
      </div>
    </div>
  );
}

// ─── 팀원 기여도 패널 ────────────────────────────────────────────────────────────

function ContributionPanel({ postits }) {
  return (
    <div className="flex flex-col gap-3">
      {MEMBERS.map(m => {
        const authored = postits.filter(p => p.authorId === m.id);
        const accepted = authored.filter(p => p.status === 'accepted');
        const rate = authored.length > 0 ? Math.round(accepted.length / authored.length * 100) : 0;
        return (
          <div key={m.id} className="flex items-center gap-3">
            <div className="w-7 h-7 rounded-full text-white text-[10px] font-bold flex items-center justify-center shrink-0" style={{ backgroundColor: m.color }}>{m.initials[0]}</div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between text-xs mb-1"><span className="font-medium text-slate-700">{m.name}</span><span className="text-slate-400">{accepted.length}/{authored.length}개 채택</span></div>
              <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-emerald-400 rounded-full" style={{ width: `${rate}%` }} /></div>
            </div>
            <span className="text-xs font-bold text-emerald-600 w-8 text-right">{rate}%</span>
          </div>
        );
      })}
    </div>
  );
}

// ─── Main Board ───────────────────────────────────────────────────────────────

function BrainstormBoard() {
  const project = { id: window.__IDEAS_DATA__.currentUserId };

  // 서버에서 오는 x/y는 이미 캔버스 절대 좌표다 (드래그·동기화로 저장된 실제 위치).
  // 컬럼에 배정된 메모는 그 컬럼 범위 안에 있는지만 보정하고, 나머지는 캔버스 범위로만 clamp한다.
  function initPostits() {
    return INITIAL_POSTITS.map(p => {
      if (p.columnId && p.status !== 'held') {
        const col = COLUMNS.find(c => c.id === p.columnId);
        if (col) {
          const c = constrainToColumn(col, p.x, p.y);
          return { ...p, x: c.x, y: c.y };
        }
      }
      return {
        ...p,
        x: Math.max(0, Math.min(CANVAS_W - PW, p.x)),
        y: Math.max(0, Math.min(CANVAS_H - PH, p.y)),
      };
    });
  }

  const [postits, setPostits] = useState(initPostits);
  const [connections, setConnections] = useState(INITIAL_CONNECTIONS);
  const [selectedId, setSelectedId] = useState(null);
  const [tool, setTool] = useState('select');
  const [connSrc, setConnSrc] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showContrib, setShowContrib] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editingText, setEditingText] = useState('');
  const [isAnimated, setIsAnimated] = useState(false);
  const [previewColumn, setPreviewColumn] = useState(null);
  const [showAnalysis, setShowAnalysis] = useState(false);
  const [analysisLoading, setAnalysisLoading] = useState(false);
  const [filter, setFilter] = useState('all');
  const [zoom, setZoom] = useState(0.75);
  const [panX, setPanX] = useState(0);
  const [panY, setPanY] = useState(0);

  const containerRef = useRef(null);
  const dragRef = useRef(null);
  const panDragRef = useRef(null);
  const syncTimer = useRef(null);
  const isFirstRender = useRef(true);

  useEffect(() => {
    if (isFirstRender.current) { isFirstRender.current = false; return; }
    clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(() => syncToServer(postits, connections), 900);
  }, [postits, connections]);

  const heldPostits = postits.filter(p => p.status === 'held');
  const activePostits = postits.filter(p => p.status !== 'held');
  const visiblePostits = filter === 'all' ? activePostits : activePostits.filter(p => p.status === filter);
  const visibleIds = new Set(visiblePostits.map(p => p.id));
  const heldIds = new Set(heldPostits.map(p => p.id));
  const visibleConnections = connections.filter(c => visibleIds.has(c.fromId) && visibleIds.has(c.toId) && !heldIds.has(c.fromId) && !heldIds.has(c.toId));
  const acceptedCount = postits.filter(p => p.status === 'accepted').length;
  const unclassifiedCount = activePostits.filter(p => !p.columnId).length;

  const handlePostitMouseDown = useCallback((e, pid) => {
    if (tool === 'connect') {
      e.stopPropagation();
      if (!connSrc) { setConnSrc(pid); return; }
      if (connSrc !== pid) {
        const exists = connections.some(c => (c.fromId === connSrc && c.toId === pid) || (c.fromId === pid && c.toId === connSrc));
        if (!exists) setConnections(prev => [...prev, { id: `c${Date.now()}`, fromId: connSrc, toId: pid }]);
        setConnSrc(null); setTool('select');
      }
      return;
    }
    if (tool !== 'select') return;
    e.stopPropagation();
    setSelectedId(pid);
    const p = postits.find(x => x.id === pid);
    if (!p) return;
    dragRef.current = { id: pid, startX: e.clientX, startY: e.clientY, origX: p.x, origY: p.y, startZoom: zoom };
  }, [tool, connSrc, connections, postits, zoom]);

  function handleCanvasMouseDown(e) {
    const target = e.target;
    const isBackground = target === e.currentTarget || (target instanceof SVGElement && target.tagName.toLowerCase() === 'svg') || target.getAttribute('data-canvas-bg') === 'true';
    if (!isBackground) return;
    if (tool === 'select') panDragRef.current = { startX: e.clientX, startY: e.clientY, startPanX: panX, startPanY: panY };
  }

  function handleCanvasClick(e) {
    const target = e.target;
    const isBackground = target === e.currentTarget || (target instanceof SVGElement && target.tagName.toLowerCase() === 'svg') || target.getAttribute('data-canvas-bg') === 'true';
    if (!isBackground) return;
    setSelectedId(null);
    if (tool === 'connect') setConnSrc(null);
  }

  useEffect(() => {
    function onMove(e) {
      if (dragRef.current) {
        const { id, startX, startY, origX, origY, startZoom } = dragRef.current;
        const dx = (e.clientX - startX) / startZoom;
        const dy = (e.clientY - startY) / startZoom;
        setPostits(prev => prev.map(p => {
          if (p.id !== id) return p;
          let newX = origX + dx, newY = origY + dy;
          if (p.columnId) {
            const col = COLUMNS.find(c => c.id === p.columnId);
            if (col) { const c = constrainToColumn(col, newX, newY); newX = c.x; newY = c.y; }
          } else {
            newX = Math.max(0, Math.min(CANVAS_W - PW, newX));
            newY = Math.max(0, Math.min(CANVAS_H - PH, newY));
          }
          return { ...p, x: newX, y: newY };
        }));
      }
      if (panDragRef.current) {
        const { startX, startY, startPanX, startPanY } = panDragRef.current;
        setPanX(startPanX + e.clientX - startX);
        setPanY(startPanY + e.clientY - startY);
      }
    }
    function onUp() {
      if (dragRef.current) {
        const { id } = dragRef.current;
        setPostits(prev => prev.map(p => {
          if (p.id !== id) return p;
          if (!p.columnId) {
            const newColId = findColumnForPoint(p.x + PW / 2, p.y + PH / 2);
            if (newColId) {
              const col = COLUMNS.find(c => c.id === newColId);
              const c = constrainToColumn(col, p.x, p.y);
              return { ...p, columnId: newColId, x: c.x, y: c.y, rotation: 0 };
            }
          }
          return p;
        }));
      }
      dragRef.current = null;
      panDragRef.current = null;
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, []);

  // React가 wheel 리스너를 passive로 등록해 e.preventDefault()가 조용히 무시되므로,
  // { passive: false } 네이티브 리스너를 직접 붙여서 확실하게 막는다.
  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    function onWheel(e) {
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP;
      const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
      const canvasX = (mouseX - panX) / zoom, canvasY = (mouseY - panY) / zoom;
      setZoom(newZoom);
      setPanX(mouseX - canvasX * newZoom);
      setPanY(mouseY - canvasY * newZoom);
    }
    container.addEventListener('wheel', onWheel, { passive: false });
    return () => container.removeEventListener('wheel', onWheel);
  }, [zoom, panX, panY]);

  function zoomAround(newZoom) {
    const container = containerRef.current;
    if (!container) { setZoom(newZoom); return; }
    const { width, height } = container.getBoundingClientRect();
    const cx = width / 2, cy = height / 2;
    const canvasX = (cx - panX) / zoom, canvasY = (cy - panY) / zoom;
    setZoom(newZoom);
    setPanX(cx - canvasX * newZoom);
    setPanY(cy - canvasY * newZoom);
  }
  const handleZoomIn = () => zoomAround(Math.min(MAX_ZOOM, zoom * ZOOM_STEP));
  const handleZoomOut = () => zoomAround(Math.max(MIN_ZOOM, zoom / ZOOM_STEP));
  const handleZoomReset = () => { setZoom(0.75); setPanX(0); setPanY(0); };

  function handleStatusChange(pid, status) {
    if (status === 'held') {
      setConnections(prev => prev.filter(c => c.fromId !== pid && c.toId !== pid));
      setPostits(prev => prev.map(p => p.id === pid ? { ...p, status, rotation: 0, columnId: null } : p));
    } else {
      setPostits(prev => prev.map(p => p.id === pid ? { ...p, status } : p));
    }
  }

  function handleAssigneeChange(pid, assigneeId) { setPostits(prev => prev.map(p => p.id === pid ? { ...p, assigneeId } : p)); }

  function handleAdd(content, color, authorId) {
    const container = containerRef.current;
    let cx = 600, cy = FREE_AREA_Y + 80;
    if (container) {
      const rect = container.getBoundingClientRect();
      cx = (rect.width / 2 - panX) / zoom;
      cy = Math.max(FREE_AREA_Y + 10, Math.min(FREE_AREA_Y + FREE_AREA_H - PH - 10, (rect.height / 3 - panY) / zoom));
    }
    setPostits(prev => [...prev, {
      id: `p${Date.now()}`, content, color,
      x: Math.max(COL_PAD_X, Math.min(CANVAS_W - PW - 40, cx - PW / 2 + (Math.random() - 0.5) * 200)),
      y: Math.max(FREE_AREA_Y, Math.min(FREE_AREA_Y + FREE_AREA_H - PH, cy - PH / 2)),
      authorId, assigneeId: null, status: 'default', rotation: (Math.random() - 0.5) * 4, nodeType: 'note', columnId: null,
    }]);
  }

  function handleDelete(pid) {
    setPostits(prev => prev.filter(p => p.id !== pid));
    setConnections(prev => prev.filter(c => c.fromId !== pid && c.toId !== pid));
    if (selectedId === pid) setSelectedId(null);
  }

  function handleDoubleClick(pid) {
    const p = postits.find(x => x.id === pid);
    if (!p) return;
    setEditingId(pid); setEditingText(p.content);
  }

  function handleEditDone() {
    if (editingId && editingText.trim()) setPostits(prev => prev.map(p => p.id === editingId ? { ...p, content: editingText } : p));
    setEditingId(null);
  }

  function handleAutoArrange() {
    setIsAnimated(true);
    const colGroups = {};
    const freeNotes = [];
    for (const col of COLUMNS) colGroups[col.id] = [];
    for (const p of activePostits) {
      if (p.columnId && colGroups[p.columnId]) colGroups[p.columnId].push(p);
      else freeNotes.push(p);
    }
    const newPositions = {};
    const COLS_PER_ROW = 2, NOTE_GAP = 14;
    for (const col of COLUMNS) {
      colGroups[col.id].forEach((p, i) => {
        const c = i % COLS_PER_ROW, r = Math.floor(i / COLS_PER_ROW);
        const noteW = (COL_W - 24) / COLS_PER_ROW;
        newPositions[p.id] = { x: col.x + 10 + c * (noteW + NOTE_GAP), y: col.y + COL_HEADER_H + 12 + r * (PH + NOTE_GAP) };
      });
    }
    freeNotes.forEach((p, i) => {
      const COLS = 6, c = i % COLS, r = Math.floor(i / COLS);
      newPositions[p.id] = { x: COL_PAD_X + c * (PW + NOTE_GAP), y: FREE_AREA_Y + 10 + r * (PH + NOTE_GAP) };
    });
    setPostits(prev => prev.map(p => newPositions[p.id] ? { ...p, ...newPositions[p.id], rotation: 0 } : p));
    setTimeout(() => setIsAnimated(false), 500);
  }

  const HELD_STRIP_H = heldPostits.length > 0 ? 160 : 40;

  return (
    <div className="h-screen flex flex-col overflow-hidden" style={{ backgroundColor: '#F8F8F7' }}>
      <div className="h-14 bg-white border-b border-slate-200 flex items-center px-4 gap-2 shrink-0 z-10 overflow-x-auto" style={{ scrollbarWidth: 'none' }}>
        <a href={BACK_URL} className="flex items-center gap-1.5 text-slate-500 hover:text-slate-700 text-sm transition-colors shrink-0" style={{ textDecoration: 'none' }}>← PRD로 돌아가기</a>
        <div className="w-px h-5 bg-slate-200" />
        <span className="text-sm font-bold text-slate-800 truncate max-w-[160px]">{PROJECT_TITLE}</span>
        <span className="text-xs text-slate-400 shrink-0">· 브레인스토밍</span>

        <div className="flex items-center gap-2 ml-1">
          <span className="text-xs bg-slate-100 px-2 py-1 rounded-full text-slate-600 font-medium shrink-0">{activePostits.length}개 메모</span>
          {unclassifiedCount > 0 && <span className="text-xs bg-amber-50 px-2 py-1 rounded-full text-amber-700 font-medium shrink-0">미분류 {unclassifiedCount}</span>}
          <span className="text-xs bg-emerald-50 px-2 py-1 rounded-full text-emerald-700 font-medium shrink-0">✓ {acceptedCount}개 채택</span>
        </div>

        <div className="flex items-center gap-1 ml-3 bg-slate-100 rounded-xl p-1 shrink-0">
          {[{ t: 'select', l: '선택', i: '↖' }, { t: 'connect', l: '연결', i: '⤴' }].map(({ t, l, i }) => (
            <button key={t} onClick={() => { setTool(t); if (t !== 'connect') setConnSrc(null); }} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${tool === t ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:bg-white/70'}`}>{i} {l}</button>
          ))}
          <button onClick={() => setShowAdd(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:bg-white/70 transition-all">+ 메모 추가</button>
        </div>

        <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 shrink-0">
          {[{ v: 'all', l: '전체' }, { v: 'accepted', l: '채택됨' }, { v: 'default', l: '기본' }].map(f => (
            <button key={f.v} onClick={() => setFilter(f.v)} className={`px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all ${filter === f.v ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>{f.l}</button>
          ))}
        </div>

        <button onClick={handleAutoArrange} className="flex items-center gap-1.5 text-xs font-semibold text-violet-700 border border-violet-200 bg-violet-50 rounded-lg px-3 py-1.5 hover:bg-violet-100 transition-colors shrink-0">⊞ 자동 정렬</button>

        <div className="ml-auto flex items-center gap-2 shrink-0">
          <button onClick={() => setShowContrib(!showContrib)} className={`flex items-center gap-1.5 text-xs border rounded-lg px-3 py-1.5 transition-colors ${showContrib ? 'border-indigo-300 bg-indigo-50 text-indigo-700' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>📊 기여도</button>
          <button onClick={() => { setAnalysisLoading(true); setShowAnalysis(true); setTimeout(() => setAnalysisLoading(false), 1400); }} className="text-xs bg-indigo-600 text-white font-semibold px-4 py-1.5 rounded-lg hover:bg-indigo-700 transition-colors">✦ AI 분석</button>
          <a href={BACK_URL} className="text-xs border border-indigo-200 text-indigo-700 font-semibold px-4 py-1.5 rounded-lg hover:bg-indigo-50 transition-colors" style={{ textDecoration: 'none' }}>PRD에 반영</a>
        </div>
      </div>

      {tool === 'connect' && (
        <div className="bg-violet-600 h-8 flex items-center justify-center gap-3 text-xs text-white font-medium shrink-0">
          ⤴ {connSrc ? '두 번째 메모를 클릭하세요' : '연결할 첫 번째 메모를 클릭하세요'}
          <button onClick={() => { setTool('select'); setConnSrc(null); }} className="text-violet-200 hover:text-white underline">취소</button>
        </div>
      )}

      <div ref={containerRef} className="flex-1 overflow-hidden relative" style={{ minHeight: 0, cursor: tool === 'connect' ? 'crosshair' : 'default' }}>
        <div className="absolute bottom-4 right-4 z-30 flex flex-col items-center gap-1 bg-white rounded-xl shadow-lg border border-slate-200 p-1.5">
          <button onClick={handleZoomIn} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-700 font-bold text-lg transition-colors">+</button>
          <span className="text-[10px] text-slate-400 font-medium tabular-nums">{Math.round(zoom * 100)}%</span>
          <button onClick={handleZoomOut} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-700 font-bold text-lg transition-colors">−</button>
          <div className="h-px bg-slate-200 w-full my-0.5" />
          <button onClick={handleZoomReset} title="리셋" className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 text-sm transition-colors">🏠</button>
        </div>

        <div style={{ transform: `translate(${panX}px, ${panY}px) scale(${zoom})`, transformOrigin: '0 0', width: CANVAS_W, height: CANVAS_H, position: 'relative' }}
          onMouseDown={handleCanvasMouseDown} onClick={handleCanvasClick}>
          <svg className="absolute inset-0" width={CANVAS_W} height={CANVAS_H} style={{ zIndex: 0, pointerEvents: 'none' }}>
            <defs>
              <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="1" fill="#D1D5DB" opacity="0.6" />
              </pattern>
            </defs>
            <rect width={CANVAS_W} height={CANVAS_H} fill="#F8F8F7" />
            <rect width={CANVAS_W} height={CANVAS_H} fill="url(#dots)" />
          </svg>

          <div data-canvas-bg="true" style={{ position: 'absolute', inset: 0, zIndex: 1 }} />

          <div style={{ position: 'absolute', left: COL_PAD_X, top: FREE_AREA_Y - 4, zIndex: 2, pointerEvents: 'none' }}>
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">미분류 아이디어</span>
              {unclassifiedCount > 0 && <span className="text-[10px] font-bold bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded-full">{unclassifiedCount}</span>}
            </div>
            <p className="text-[10px] text-slate-300 mt-0.5">메모는 여기서 자유롭게 작성하고, 아래 칸으로 드래그해 분류하세요</p>
          </div>

          <div style={{ position: 'absolute', left: COL_PAD_X - 8, top: FREE_AREA_Y + 16, width: Math.max(COLUMNS.length * (COL_W + COL_GAP) - COL_GAP + 16, 1200), height: FREE_AREA_H, border: '1.5px dashed #D1D5DB', borderRadius: 16, zIndex: 2, pointerEvents: 'none', backgroundColor: 'rgba(255,255,255,0.5)' }} />

          {COLUMNS.map((col, idx) => {
            const colorCfg = COL_COLORS[col.colorIdx];
            const colNotes = visiblePostits.filter(p => p.columnId === col.id);
            return (
              <div key={col.id} style={{ position: 'absolute', left: col.x, top: col.y, width: COL_W, height: COL_TOTAL_H, zIndex: 2, borderRadius: 16, overflow: 'hidden', border: `1.5px solid ${colorCfg.border}`, pointerEvents: 'none' }}>
                <div style={{ position: 'absolute', inset: 0, backgroundColor: colorCfg.bg, opacity: 0.85 }} />
                <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: COL_HEADER_H, backgroundColor: colorCfg.header, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 14px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span style={{ color: colorCfg.headerText, opacity: 0.7, fontSize: 10, fontWeight: 600 }}>{idx + 1}</span>
                    <span style={{ color: colorCfg.headerText, fontSize: 11, fontWeight: 700, lineHeight: 1.3 }}>{col.title}</span>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 3 }}>
                    <span style={{ color: colorCfg.headerText, opacity: 0.6, fontSize: 10 }}>{colNotes.length}개 아이디어</span>
                  </div>
                </div>
              </div>
            );
          })}

          {COLUMNS.map(col => {
            const colorCfg = COL_COLORS[col.colorIdx];
            return (
              <div key={`btn-${col.id}`} style={{ position: 'absolute', left: col.x + 10, top: col.y + COL_TOTAL_H - 42, width: COL_W - 20, zIndex: 8 }}
                onMouseDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); setPreviewColumn(col); }}>
                <button className="w-full flex items-center justify-center gap-1.5 text-xs font-semibold rounded-xl py-2 transition-all hover:opacity-90 cursor-pointer" style={{ backgroundColor: colorCfg.header, color: colorCfg.headerText, boxShadow: '0 1px 4px rgba(0,0,0,0.15)' }}>✦ AI PRD 적용</button>
              </div>
            );
          })}

          <svg className="absolute inset-0" width={CANVAS_W} height={CANVAS_H} style={{ zIndex: 5, pointerEvents: 'none' }}>
            {visibleConnections.map(conn => {
              const fromP = postits.find(p => p.id === conn.fromId);
              const toP = postits.find(p => p.id === conn.toId);
              if (!fromP || !toP) return null;
              const { d } = connPath(fromP, toP);
              const crossColumn = fromP.columnId !== toP.columnId;
              return <path key={conn.id} d={d} style={{ pointerEvents: 'none', fill: 'none', stroke: crossColumn ? '#6366F1' : '#94A3B8', strokeWidth: crossColumn ? 2 : 1.5, strokeDasharray: crossColumn ? '5 3' : 'none', opacity: crossColumn ? 0.8 : 0.9 }} />;
            })}
          </svg>

          {visibleConnections.map(conn => {
            const fromP = postits.find(p => p.id === conn.fromId);
            const toP = postits.find(p => p.id === conn.toId);
            if (!fromP || !toP) return null;
            const { mx, my } = connPath(fromP, toP);
            return (
              <div key={`del-${conn.id}`} className="absolute" style={{ left: mx - 10, top: my - 10, width: 20, height: 20, zIndex: 6, cursor: 'pointer' }}
                onMouseDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); setConnections(prev => prev.filter(c => c.id !== conn.id)); }}>
                <div className="conn-delete-btn w-full h-full rounded-full bg-white border border-slate-300 flex items-center justify-center shadow-sm">
                  <span className="text-[11px] text-slate-500 font-bold leading-none select-none">×</span>
                </div>
              </div>
            );
          })}

          {visiblePostits.map(p => editingId === p.id ? (
            <div key={p.id} className="absolute" style={{ left: p.x, top: p.y, width: PW, zIndex: 30, transform: `rotate(${p.rotation}deg)` }}>
              <textarea autoFocus value={editingText} onChange={e => setEditingText(e.target.value)} onBlur={handleEditDone} onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) handleEditDone(); }}
                className="w-full rounded-xl p-3 text-xs leading-relaxed border-2 border-indigo-400 focus:outline-none postit-shadow" style={{ backgroundColor: p.color, height: PH }} />
            </div>
          ) : (
            <PostItCard key={p.id} postit={p} isSelected={selectedId === p.id} isConnectSrc={connSrc === p.id} isAnimated={isAnimated}
              onMouseDown={e => handlePostitMouseDown(e, p.id)} onDoubleClick={() => handleDoubleClick(p.id)}
              onStatusChange={s => handleStatusChange(p.id, s)} onAssigneeChange={aid => handleAssigneeChange(p.id, aid)} onDelete={() => handleDelete(p.id)} />
          ))}
        </div>
      </div>

      <div style={{ flexShrink: 0, height: HELD_STRIP_H, transition: 'height .3s ease', borderTop: '2px dashed #FCD34D', background: 'rgba(255,251,235,0.97)', backdropFilter: 'blur(4px)', display: 'flex', flexDirection: 'column', zIndex: 10 }}>
        <div className="flex items-center gap-2 px-4 py-2 shrink-0">
          <span className="text-xs font-bold text-amber-600">⏸ 보류 구역</span>
          <span className="bg-amber-200 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded-full">{heldPostits.length}</span>
          {heldPostits.length > 0 && <span className="text-[10px] text-amber-500 ml-1">· hover 후 복원을 누르면 캔버스로 돌아갑니다</span>}
        </div>
        {heldPostits.length > 0 && (
          <div className="flex gap-3 px-4 pb-3 overflow-x-auto" style={{ minHeight: 0, alignItems: 'flex-start' }}>
            {heldPostits.map(p => {
              const auth = MEMBERS.find(m => m.id === p.authorId);
              const colorCfg = COLORS.find(c => c.value === p.color) || COLORS[0];
              return (
                <div key={p.id} className="held-card" style={{ backgroundColor: p.color, borderColor: colorCfg.border }}>
                  <span className="held-restore" onClick={() => handleStatusChange(p.id, 'default')}>복원 →</span>
                  <p className="text-[11px] text-slate-700 leading-relaxed line-clamp-3 pr-10">{p.content}</p>
                  {auth && <div className="flex items-center gap-1 mt-1.5"><div className="w-3.5 h-3.5 rounded-full text-white text-[7px] font-bold flex items-center justify-center shrink-0" style={{ backgroundColor: auth.color }}>{auth.initials[0]}</div><span className="text-[10px] text-slate-500">{auth.name}</span></div>}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showAdd && <AddModal onAdd={handleAdd} onClose={() => setShowAdd(false)} />}
      {previewColumn && <ColumnPRDPreview column={previewColumn} postits={postits} onClose={() => setPreviewColumn(null)} />}

      {showContrib && (
        <div className="fixed right-0 top-14 bottom-0 w-80 bg-white border-l border-slate-200 z-20 flex flex-col shadow-2xl" style={{ bottom: HELD_STRIP_H }}>
          <div className="flex items-center justify-between px-5 py-3.5 border-b border-slate-100">
            <span className="text-sm font-bold text-slate-800">📊 팀원 기여도</span>
            <button onClick={() => setShowContrib(false)} className="text-slate-400 hover:text-slate-600 text-xl">×</button>
          </div>
          <div className="flex-1 overflow-y-auto px-5 py-5">
            <p className="text-xs text-slate-500 mb-4 leading-relaxed">포스트잇 채택 수 기준으로 기여도를 산정합니다.</p>
            <ContributionPanel postits={postits} />
            <div className="mt-5 border-t border-slate-100 pt-4 grid grid-cols-2 gap-3">
              <div className="bg-slate-50 rounded-xl p-3"><p className="text-[10px] text-slate-400">전체 메모</p><p className="text-2xl font-bold text-slate-800">{postits.length}</p></div>
              <div className="bg-emerald-50 rounded-xl p-3"><p className="text-[10px] text-emerald-600">채택률</p><p className="text-2xl font-bold text-emerald-700">{postits.length > 0 ? Math.round(acceptedCount / postits.length * 100) : 0}%</p></div>
            </div>
          </div>
        </div>
      )}

      {showAnalysis && (
        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div className="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-indigo-600 to-violet-600">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white text-sm">✦</div>
                <div><p className="text-sm font-bold text-white">AI 브레인스토밍 분석</p><p className="text-xs text-indigo-200">섹션별 아이디어 현황</p></div>
              </div>
              <button onClick={() => setShowAnalysis(false)} className="text-white/70 hover:text-white text-xl">×</button>
            </div>
            {analysisLoading ? (
              <div className="flex flex-col items-center justify-center py-16 gap-4">
                <div className="w-10 h-10 border-[3px] border-indigo-100 border-t-indigo-600 rounded-full animate-spin" />
                <p className="text-sm text-slate-500">분석 중…</p>
              </div>
            ) : (
              <div className="p-6 flex flex-col gap-4">
                <div className="grid grid-cols-3 gap-3 mb-2">
                  {[
                    { label: '전체 메모', value: activePostits.length, cls: 'bg-slate-50 text-slate-700' },
                    { label: '채택됨', value: acceptedCount, cls: 'bg-emerald-50 text-emerald-700' },
                    { label: '미분류', value: unclassifiedCount, cls: 'bg-amber-50 text-amber-700' },
                  ].map(({ label, value, cls }) => (
                    <div key={label} className={`rounded-xl p-3 text-center ${cls.split(' ')[0]}`}>
                      <p className={`text-2xl font-bold ${cls.split(' ')[1]}`}>{value}</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">{label}</p>
                    </div>
                  ))}
                </div>
                <div className="flex flex-col gap-2">
                  {COLUMNS.map(col => {
                    const colNotes = activePostits.filter(p => p.columnId === col.id);
                    const colAccepted = colNotes.filter(p => p.status === 'accepted');
                    const colorCfg = COL_COLORS[col.colorIdx];
                    return (
                      <div key={col.id} className="flex items-center gap-3 p-2.5 rounded-xl border border-slate-100 bg-slate-50">
                        <div className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: colorCfg.header }} />
                        <span className="text-xs text-slate-600 flex-1 truncate">{col.title}</span>
                        <span className="text-xs font-semibold text-slate-500">{colNotes.length}개</span>
                        {colAccepted.length > 0 && <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-full">✓{colAccepted.length}</span>}
                        {colNotes.length === 0 && <span className="text-[10px] text-slate-300">비어있음</span>}
                      </div>
                    );
                  })}
                </div>
                <div className="bg-violet-50 border border-violet-100 rounded-xl p-4">
                  <p className="text-xs font-semibold text-violet-700 mb-1.5">✦ AI 코멘트</p>
                  <p className="text-xs text-violet-600 leading-relaxed">
                    {unclassifiedCount > 0 ? `미분류 메모 ${unclassifiedCount}개가 있어요. 칸으로 드래그해 분류해보세요. ` : ''}
                    전체 {activePostits.length}개 아이디어 중 {acceptedCount}개가 채택되었습니다.
                    {COLUMNS.filter(c => activePostits.filter(p => p.columnId === c.id).length === 0).length > 0
                      ? ' 아직 아이디어가 없는 섹션이 있어요 — 각 섹션에 최소 1개의 아이디어를 채워보세요!'
                      : ' 모든 섹션에 아이디어가 있네요! 채택됨으로 표시하고 PRD에 반영해보세요.'}
                  </p>
                </div>
                <button onClick={() => setShowAnalysis(false)} className="w-full bg-indigo-600 text-white text-sm font-semibold py-2.5 rounded-xl hover:bg-indigo-700 transition-colors">확인</button>
              </div>
            )}
          </div>
        </div>
      )}

      {editingId && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50">Enter로 완료 · 외부 클릭으로 닫기</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('brainstorm-root')).render(<BrainstormBoard />);
</script>
{% endverbatim %}
</body>
</html>
